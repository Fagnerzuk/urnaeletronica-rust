<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica — Rust + WebAssembly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="urna">
    <section class="tela">
      <div class="topo">
        <span>ELEIÇÕES</span>
        <strong>URNA ELETRÔNICA</strong>
      </div>

      <div id="mensagem" class="mensagem">SEU VOTO PARA</div>
      <div class="cargo">VEREADOR</div>

      <div class="numero-area">
        <span id="digito1"></span>
        <span id="digito2"></span>
        <span id="digito3"></span>
      </div>

      <div id="candidato" class="candidato hidden">
        <div><b>Nome:</b> <span id="nome"></span></div>
        <div><b>Partido:</b> <span id="partido"></span></div>
      </div>

      <div id="status" class="status">Digite o número do candidato</div>
    </section>

    <section class="teclado">
      <div class="numero-teclas">
        <button data-num="1">1</button>
        <button data-num="2">2</button>
        <button data-num="3">3</button>
        <button data-num="4">4</button>
        <button data-num="5">5</button>
        <button data-num="6">6</button>
        <button data-num="7">7</button>
        <button data-num="8">8</button>
        <button data-num="9">9</button>
        <button data-num="0" class="zero">0</button>
      </div>

      <div class="acoes">
        <button id="branco" class="branco">BRANCO</button>
        <button id="corrige" class="corrige">CORRIGE</button>
        <button id="confirma" class="confirma">CONFIRMA</button>
      </div>

      <button id="resultados" class="resultado-btn">RESULTADOS</button>
    </section>
  </main>

  <div id="resultado-modal" class="modal hidden">
    <div class="modal-box">
      <button id="fechar" class="fechar">×</button>
      <h2>Resultado da votação</h2>
      <div id="lista-resultados"></div>
      <p>Total de votos: <b id="total"></b></p>
      <small>Projeto educacional — votação fictícia.</small>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
